name: QuranForWomen
options:
  bundleIdPrefix: com.quranforwomen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuranForWomen:
    type: application
    platform: iOS
    sources:
      - path: QuranForWomen
    info:
      path: QuranForWomen/Info.plist
      properties:
        CFBundleDisplayName: Quran for Women
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.quranforwomen.app
            CFBundleURLSchemes:
              - quranforwomen
        NSFaceIDUsageDescription: Face ID keeps your journal private.
        NSMicrophoneUsageDescription: The microphone is used only while you record a khutbah or class for your notes. Audio is not saved.
        NSSpeechRecognitionUsageDescription: Speech recognition writes out a lesson as you record it, on this iPhone when possible.
        NSLocationWhenInUseUsageDescription: Your location is used to work out prayer times and the Qibla direction. It is never shared with us.
    entitlements:
      path: QuranForWomen/QuranForWomen.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quranforwomen.app
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: QuranForWomenWidget
    scheme:
      testTargets:
        - QuranForWomenTests
      gatherCoverageData: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranforwomen.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  QuranForWomenWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: QuranForWomenWidget
      - path: QuranForWomen/Resources/widget-verses.json
      - path: QuranForWomen/Resources/content.json
      - path: QuranForWomen/Data/PrayerCalculation.swift
      - path: QuranForWomen/Resources/Fonts/AmiriQuran-Regular.ttf
    info:
      path: QuranForWomenWidget/Info.plist
      properties:
        CFBundleDisplayName: Verse of the Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: QuranForWomenWidget/QuranForWomenWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.quranforwomen.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranforwomen.app.widget
        TARGETED_DEVICE_FAMILY: "1"

  QuranForWomenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuranForWomenTests
    dependencies:
      - target: QuranForWomen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranforwomen.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/QuranForWomen.app/QuranForWomen
        BUNDLE_LOADER: $(TEST_HOST)
