<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran for Women</title>
<meta name="description" content="Quran for Women: Quran, duas, dhikr, prayer times and a private journal. No ads, no account.">
<style>
  :root {
    --emerald: #064E3B;
    --emerald-soft: #0B6B52;
    --cream: #FAF7F0;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --muted: #5B665F;
    --line: #E6E0D2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  header {
    background: var(--emerald);
    color: var(--cream);
    padding: 40px 20px 32px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header .app { margin: 0 0 6px; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; }
  header h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 32px; line-height: 1.2; }
  header .lead { margin: 10px 0 0; opacity: 0.9; }
  main { padding: 24px 20px 48px; }
  h2 {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--emerald);
    font-size: 22px;
    font-weight: 600;
    margin: 32px 0 12px;
  }
  p, li { margin: 0 0 10px; }
  ul { padding-left: 22px; }
  a { color: var(--emerald-soft); }
  details {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin: 0 0 10px;
    padding: 0 18px;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
    padding: 14px 0;
    list-style-position: outside;
  }
  details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  details > *:last-child { margin-bottom: 16px; }
  .contact {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
  }
  footer { border-top: 1px solid var(--line); padding: 20px; color: var(--muted); font-size: 15px; }
  footer a { margin-right: 16px; }
  @media (prefers-color-scheme: dark) {
    :root { --cream: #0F1A16; --card: #16241F; --ink: #ECE7DC; --muted: #A9B3AC; --line: #26372F; --emerald-soft: #6FCFAE; }
    header { background: #06392C; color: #FAF7F0; }
    h2 { color: #8ED9BE; }
  }
  .links a { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:0 0 10px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Quran for Women</h1>
    <p class="lead">Quran, duas, dhikr, prayer times and a private journal. No ads, no account.</p>
  </div>
</header>
<main>
  <div class="wrap links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</main>
</body>
</html>
