<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran for Women Preview</title>
<style>
@font-face { font-family: "Amiri Quran"; src: url("../QuranForWomen/Resources/Fonts/AmiriQuran-Regular.ttf") format("truetype"); }
:root {
  --accent:#064E3B; --accentFill:#064E3B; --onAccent:#fff; --wash:#E4EEE9;
  --blush:#F5DCE3; --blushStrong:#B24D6B;
  --bg:#FAF7F0; --surface:#FFFFFF; --sunken:#F3EFE5;
  --text:#17251F; --text2:#5F6D66; --border:#E7E5DD;
  --paper:#FFFDF7; --paperShade:#EDE5D3; --glow:#FFF1D6;
  --serif: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
.dark {
  --accent:#7FD1AE; --accentFill:#0F6B50; --wash:#16271F;
  --blush:#3D2830; --blushStrong:#E9A9BC;
  --bg:#0E1311; --surface:#171E1B; --sunken:#121816;
  --text:#EDEAE2; --text2:#A3ADA7; --border:#27302C;
  --paper:#E9E3D4; --paperShade:#CFC6B2; --glow:rgba(243,230,200,.10);
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { background:#d9d6cf; font-family:var(--sans); display:flex; align-items:center; justify-content:center; gap:28px; padding:20px; min-height:100vh; }
.controls { display:flex; flex-direction:column; gap:10px; width:180px; font-size:13px; color:#333; }
.controls h1 { font-size:15px; font-weight:600; }
.controls p { color:#666; line-height:1.4; }
.controls button { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid #bbb; background:#fff; cursor:pointer; }
.phone { width:440px; height:956px; border-radius:68px; background:#111; padding:12px; box-shadow:0 30px 80px rgba(0,0,0,.25); flex-shrink:0; }
.screen { position:relative; width:100%; height:100%; border-radius:56px; overflow:hidden; background:var(--bg); color:var(--text); }
.status { position:absolute; top:0; left:0; right:0; height:56px; display:flex; justify-content:space-between; align-items:center; padding:8px 36px 0; font-weight:600; font-size:16px; z-index:30; pointer-events:none; }
.island { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:20px; z-index:31; }
.home { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:140px; height:5px; border-radius:3px; background:var(--text); opacity:.85; z-index:40; }
.view { position:absolute; inset:0; overflow-y:auto; padding:62px 20px 120px; scrollbar-width:none; }
.view::-webkit-scrollbar { display:none; }
.view.notab { padding-bottom:40px; }
.navbar { position:sticky; top:-62px; margin:-62px -20px 0; padding:62px 12px 8px; display:flex; align-items:center; justify-content:space-between; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(18px); z-index:10; min-height:106px; }
.navbar .title { font-weight:600; font-size:17px; position:absolute; left:50%; transform:translateX(-50%); bottom:14px; white-space:nowrap; }
.navbtn { background:none; border:none; color:var(--accent); font:inherit; font-size:17px; display:flex; align-items:center; gap:2px; cursor:pointer; padding:8px; min-height:44px; }
.largetitle { font-size:34px; font-weight:700; letter-spacing:.2px; margin:6px 0 14px; }
.serif { font-family:var(--serif); }
.ar { font-family:"Amiri Quran", serif; direction:rtl; text-align:right; line-height:2.05; color:var(--text); }
.ar.center { text-align:center; }
.card { background:var(--surface); border:none; border-radius:22px; padding:20px; }
.group { background:var(--surface); border-radius:18px; overflow:hidden; }
.grow-row { display:flex; align-items:center; gap:14px; padding:12px 16px; min-height:48px; cursor:pointer; position:relative; }
.grow-row:active { background:var(--wash); }
.grow-row + .grow-row::before { content:''; position:absolute; top:0; left:58px; right:0; height:.5px; background:var(--border); }
.grow-row .gi { width:26px; color:var(--accent); display:flex; justify-content:center; }
.gtitle { font-size:20px; font-weight:600; margin:0 0 8px; }
.card.pad24 { padding:24px; }
.eyebrow { font-size:12px; font-weight:600; letter-spacing:.8px; color:var(--accent); text-transform:uppercase; }
.sec { font-size:20px; font-weight:600; margin-bottom:12px; }
.muted { color:var(--text2); }
.btn { width:100%; min-height:56px; border-radius:999px; border:none; background:var(--accentFill); color:var(--onAccent); font:inherit; font-size:17px; font-weight:600; cursor:pointer; transition:transform .18s ease, opacity .18s ease; }
.btn:active { transform:scale(.98); opacity:.88; }
.btn:disabled { opacity:.4; }
.btn.tinted { background:var(--wash); color:var(--accent); min-height:50px; }
.circle { width:44px; height:44px; border-radius:50%; border:none; background:var(--wash); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .18s; }
.circle.on { background:var(--blush); }
.circle:active { transform:scale(.92); }
.press { cursor:pointer; transition:transform .18s ease, opacity .18s ease; }
.press:active { transform:scale(.985); opacity:.92; }
.stack > * + * { margin-top:32px; }
.row { display:flex; align-items:center; gap:12px; }
.spacer { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; padding:5px 10px; border-radius:999px; background:var(--wash); color:var(--accent); }
.pill.personal { background:var(--blush); color:var(--blushStrong); }
.serifbody { font-family:var(--serif); font-size:17px; line-height:1.55; }
.progress { height:4px; border-radius:2px; background:var(--border); overflow:hidden; }
.progress > div { height:100%; background:var(--accent); }
.tabbar { position:absolute; left:16px; right:16px; bottom:22px; height:64px; border-radius:32px; display:flex; justify-content:space-around; align-items:center; background:color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter:blur(20px) saturate(1.4); border:1px solid color-mix(in srgb, var(--border) 70%, transparent); box-shadow:0 8px 30px rgba(0,0,0,.08); z-index:20; }
.searchbtn { position:absolute; right:16px; bottom:22px; width:64px; height:64px; border-radius:50%; z-index:20; display:flex; align-items:center; justify-content:center; color:var(--text2); cursor:pointer; background:color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter:blur(20px) saturate(1.4); border:1px solid color-mix(in srgb, var(--border) 70%, transparent); box-shadow:0 8px 30px rgba(0,0,0,.08); }
.searchbtn.on { color:var(--accent); background:var(--wash); }
.searchbtn svg { width:22px; height:22px; }
.tab { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:500; color:var(--text2); background:none; border:none; cursor:pointer; width:68px; padding:6px 0; border-radius:24px; }
.tab.on { color:var(--accent); background:var(--wash); }
.list { background:var(--surface); border-radius:14px; overflow:hidden; }
.list .li { display:flex; align-items:center; gap:12px; padding:11px 16px; cursor:pointer; position:relative; }
.list .li + .li::before { content:""; position:absolute; top:0; left:58px; right:0; height:1px; background:var(--border); }
.chev { color:var(--text2); opacity:.6; }
.lihead { font-size:13px; color:var(--text2); text-transform:uppercase; margin:22px 16px 7px; letter-spacing:.3px; }
.icon { width:30px; height:30px; border-radius:8px; background:var(--wash); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.num { width:38px; height:38px; border-radius:11px; background:var(--wash); color:var(--accent); font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-variant-numeric:tabular-nums; }
.search { display:flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--text2) 12%, transparent); border-radius:12px; padding:9px 10px; color:var(--text2); margin-bottom:8px; }
.search input { border:none; background:none; font:inherit; font-size:17px; flex:1; color:var(--text); outline:none; }
.verse { padding:20px 12px; border-radius:18px; cursor:pointer; position:relative; transition:background .35s; }
.verse::after { content:""; position:absolute; bottom:0; left:48px; right:48px; height:1px; background:var(--border); }
.verse.sel { background:color-mix(in srgb, var(--blush) 60%, transparent); }
.verse.playing { background:var(--wash); }
.verse.sel::after, .verse.playing::after { opacity:0; }
.vref { font-size:12px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
.sheetwrap { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.25); display:flex; align-items:flex-end; animation:fade .25s ease; }
.sheet { width:100%; background:var(--bg); border-radius:28px 28px 0 0; padding:10px 20px 44px; animation:up .32s cubic-bezier(.2,.8,.2,1); }
.grabber { width:36px; height:5px; border-radius:3px; background:var(--border); margin:0 auto 16px; }
.tiles { display:flex; gap:8px; margin-top:18px; }
.tile { flex:1; min-height:72px; border-radius:14px; background:var(--surface); border:none; color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:12px; font-weight:500; cursor:pointer; }
.tile.on { background:var(--blush); }
@keyframes fade { from{opacity:0} }
@keyframes up { from{transform:translateY(100%)} }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.choice { display:flex; align-items:center; gap:16px; padding:14px 16px; border-radius:18px; background:var(--surface); border:1px solid transparent; cursor:pointer; transition:background .25s, border-color .25s; }
.choice.on { background:var(--wash); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
.check { width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.choice.on .check { background:var(--accent); border-color:var(--accent); color:var(--bg); }
.bottombar { position:absolute; left:0; right:0; bottom:0; padding:12px 24px 34px; background:color-mix(in srgb, var(--bg) 94%, transparent); z-index:15; }
.mini { position:absolute; left:16px; right:16px; bottom:94px; z-index:19; display:flex; align-items:center; gap:10px; padding:8px; border-radius:999px; background:color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter:blur(20px); border:1px solid var(--border); box-shadow:0 4px 12px rgba(0,0,0,.08); animation:up .35s ease; }
.mini.notab { bottom:30px; }
.playbtn { width:36px; height:36px; border-radius:50%; background:var(--accentFill); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
/* Welcome */
.welcome { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:70px 24px 40px; }
.welcome .grow { flex:1; min-height:20px; }
.fadein { opacity:0; transform:translateY(8px); animation:enter .8s ease-out forwards; }
.fadein.v { transform:translateY(18px) scale(.98); animation-duration:.9s; }
@keyframes enter { to { opacity:1; transform:none; } }
.book { position:relative; width:380px; height:262px; }
.glow { position:absolute; inset:-30px -50px; background:radial-gradient(ellipse at center, var(--glow), transparent 62%); }
.shadow { position:absolute; left:4%; right:4%; bottom:4px; height:22px; background:rgba(0,0,0,.16); filter:blur(12px); border-radius:50%; }
.dark .shadow { background:rgba(0,0,0,.45); }
.pages { position:absolute; left:3%; right:3%; top:7%; height:82%; display:flex; transform:perspective(900px) rotateX(14deg); transform-origin:bottom; }
.page { flex:1; position:relative; padding:20px 22px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.page.l { background:linear-gradient(to right, var(--paper) 0%, var(--paper) 72%, var(--paperShade)); border-radius:6px 1px 1px 6px; box-shadow:-2.5px 2.5px 0 var(--paperShade), -1.2px 1.2px 0 color-mix(in srgb,var(--paperShade) 70%,transparent); }
.page.r { background:linear-gradient(to left, var(--paper) 0%, var(--paper) 72%, var(--paperShade)); border-radius:1px 6px 6px 1px; box-shadow:2.5px 2.5px 0 var(--paperShade), 1.2px 1.2px 0 color-mix(in srgb,var(--paperShade) 70%,transparent); }
.page .frame { position:absolute; inset:12px; border:.8px solid rgba(6,78,59,.28); border-radius:3px; }
.page .ar { color:rgba(31,42,36,.88); font-size:13.5px; line-height:1.95; text-align:center; }
.page .hdr { font-family:"Amiri Quran"; color:rgba(6,78,59,.85); font-size:14px; margin-bottom:2px; }
.count { font-size:96px; font-weight:300; font-variant-numeric:tabular-nums; font-family:ui-rounded, "SF Pro Rounded", var(--sans); transition:transform .22s; }
.bump { animation:bump .22s ease; }
@keyframes bump { 40% { transform:translateY(-4px); opacity:.6 } }
.tap { width:100%; height:200px; border-radius:36px; background:var(--wash); border:1px solid color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-weight:500; cursor:pointer; user-select:none; transition:transform .15s; }
.tap:active { transform:scale(.97); }
.toast { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:13px; z-index:60; animation:fade .2s; }
/* Prayer sky */
.sky { position:relative; height:430px; margin:-62px -20px 0; overflow:hidden; will-change:transform; transform-origin:bottom center; }
.sky .layer { position:absolute; inset:0; transition:background 1.2s ease; }
.sky .star { position:absolute; border-radius:50%; background:#fff; animation:twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity:.35 } 50% { opacity:1 } }
.sky .arc { position:absolute; left:0; right:0; top:104px; height:200px; }
.sky .body { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; transition:left 1.6s cubic-bezier(.16,1,.3,1), top 1.6s cubic-bezier(.16,1,.3,1); }
.sky .sun { background:radial-gradient(circle,#FFF6DA,#FFD98A); box-shadow:0 0 28px 8px rgba(255,217,138,.75); }
.sky .moon { background:none; color:#F4EBCF; font-size:24px; display:flex; align-items:center; justify-content:center; text-shadow:0 0 14px rgba(244,235,207,.8); }
.sky .content { position:absolute; inset:0; padding:64px 20px 0; display:flex; flex-direction:column; }
.glass { backdrop-filter:blur(18px) saturate(1.6); -webkit-backdrop-filter:blur(18px) saturate(1.6); background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 14px rgba(0,0,0,.08); }
.chip { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer; }
.pdot { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; position:relative; transition:background .25s; }
.pdot.done { background:rgba(6,78,59,.92); border-color:rgba(255,255,255,.4); }
.pdot.pop { animation:pop .6s cubic-bezier(.2,1.4,.3,1); }
@keyframes pop { 0% { transform:scale(1) } 18% { transform:scale(.84) } 50% { transform:scale(1.1) } 100% { transform:scale(1) } }
.pdot .ring { position:absolute; inset:-2px; border-radius:50%; border:1.5px solid rgba(255,255,255,.75); animation:ring .6s ease-out forwards; pointer-events:none; }
@keyframes ring { from { transform:scale(1); opacity:.8 } to { transform:scale(1.7); opacity:0 } }
.sheet-top { position:relative; margin:-30px -20px 0; padding:24px 20px 0; background:var(--bg); border-radius:30px 30px 0 0; box-shadow:0 -4px 16px rgba(0,0,0,.08); }
/* Welcome book opening */
.page.l { transform-origin:right center; }
.page.r { transform-origin:left center; }
.opening .page.l { animation:openL 1.2s cubic-bezier(.16,1,.3,1) .35s both; }
.opening .page.r { animation:openR 1.2s cubic-bezier(.16,1,.3,1) .35s both; }
@keyframes openL { from { transform:perspective(700px) rotateY(75deg) } to { transform:perspective(700px) rotateY(0) } }
@keyframes openR { from { transform:perspective(700px) rotateY(-75deg) } to { transform:perspective(700px) rotateY(0) } }
.focusin { animation:focusin .6s cubic-bezier(.16,1,.3,1) both; }
@keyframes focusin { from { opacity:0; filter:blur(10px); transform:translateY(6px) } to { opacity:1; filter:blur(0); transform:none } }
/* Dhikr beads and ripples */
.beads { position:relative; width:264px; height:264px; margin:0 auto; }
.bead { position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:var(--border); transition:background .2s, transform .35s cubic-bezier(.2,1.6,.3,1); }
.bead.on { background:var(--accentFill); }
.bead.now { transform:scale(1.45); }
.ripple { position:absolute; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:color-mix(in srgb,var(--accent) 18%,transparent); animation:ripple .65s ease-out forwards; pointer-events:none; }
@keyframes ripple { from { transform:scale(.3); opacity:1 } to { transform:scale(6); opacity:0 } }
.welcome2 { position:absolute; inset:0; background:#FAF7F0; color:#17251F; }
.welcome2 .w-photo { position:absolute; left:0; right:0; top:0; height:64%; background:url('../QuranForWomen/Resources/Assets.xcassets/WelcomePhoto.imageset/welcome-photo.jpg') top center / cover no-repeat; animation:settle 1.6s ease-out both; }
.welcome2 .w-photo::after { content:''; position:absolute; left:0; right:0; bottom:0; height:34%; background:linear-gradient(rgba(250,247,240,0) 0%, rgba(250,247,240,.35) 40%, rgba(250,247,240,.8) 75%, #FAF7F0 100%); }
@keyframes settle { from { opacity:0; transform:scale(1.06) } to { opacity:1; transform:none } }
.welcome2 .w-top { position:absolute; left:24px; right:28px; top:84px; display:flex; justify-content:space-between; align-items:flex-start; }
.welcome2 .w-lang { display:inline-flex; gap:6px; align-items:center; padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.85); color:#064E3B; font-size:15px; font-weight:500; box-shadow:0 2px 8px rgba(0,0,0,.06); cursor:pointer; white-space:nowrap; }
.welcome2 .w-bottom { position:absolute; left:24px; right:24px; bottom:36px; display:flex; flex-direction:column; align-items:center; }
.welcome2 .btn { background:#064E3B; }
/* Onboarding */
.ob { position:absolute; inset:0; background:#FAF7F0; overflow:hidden; }
.ob .amb1, .ob .amb2 { position:absolute; border-radius:50%; filter:blur(90px); }
.ob .amb1 { width:420px; height:420px; background:rgba(245,220,227,.6); right:-160px; top:-120px; animation:drift1 14s ease-in-out infinite alternate; }
.ob .amb2 { width:380px; height:380px; background:rgba(220,237,229,.7); left:-180px; bottom:-120px; animation:drift2 16s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform:translate(-40px,40px) } }
@keyframes drift2 { to { transform:translate(40px,-30px) } }
.ob .obpage { position:absolute; inset:0; display:flex; flex-direction:column; }
.ob .in-fwd { animation:inFwd .62s cubic-bezier(.2,.9,.25,1) both; }
.ob .in-back { animation:inBack .62s cubic-bezier(.2,.9,.25,1) both; }
@keyframes inFwd { from { transform:translateX(70px); opacity:0; filter:blur(14px) } to { transform:none; opacity:1; filter:blur(0) } }
@keyframes inBack { from { transform:translateX(-70px); opacity:0; filter:blur(14px) } to { transform:none; opacity:1; filter:blur(0) } }
.ob .top { display:flex; align-items:center; gap:16px; padding:62px 24px 0; }
.ob .back { width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.8); color:#064E3B; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.ob .segs { flex:1; display:flex; gap:6px; }
.ob .seg { flex:1; height:4px; border-radius:2px; background:rgba(6,78,59,.12); overflow:hidden; }
.ob .seg > i { display:block; height:100%; width:0; background:#064E3B; border-radius:2px; }
.ob .seg.done > i { width:100%; }
.ob .seg.now > i { animation:fill .8s cubic-bezier(.16,1,.3,1) .25s forwards; }
@keyframes fill { to { width:100% } }
.ob .body { flex:1; overflow-y:auto; padding:28px 24px 20px; scrollbar-width:none; }
.ob .foot { padding:10px 24px 34px; }
.ob .hdr { animation:focusin .7s cubic-bezier(.16,1,.3,1) .12s both; }
.ob .title { font-family:var(--serif); font-size:36px; font-weight:500; color:#064E3B; margin:10px 0 6px; }
.ob .sub { font-family:var(--serif); font-size:19px; color:#5F6D66; line-height:1.4; }
.ob .rows { position:relative; margin-top:24px; display:flex; flex-direction:column; gap:8px; }
.ob .orow { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:18px; background:rgba(255,255,255,.7); cursor:pointer; opacity:0; animation:deal .55s cubic-bezier(.2,1.2,.3,1) both; transition:transform .18s; z-index:1; }
.ob .orow:active { transform:scale(.97); }
@keyframes deal { from { opacity:0; transform:translateY(22px) scale(.97) } to { opacity:1; transform:none } }
.ob .glide { position:absolute; left:0; right:0; border-radius:18px; background:#E4EEE9; border:1px solid rgba(6,78,59,.35); transition:top .42s cubic-bezier(.3,1.35,.4,1), height .42s cubic-bezier(.3,1.35,.4,1), opacity .2s; z-index:0; pointer-events:none; }
.ob .ck { width:26px; height:26px; border-radius:50%; border:1.5px solid #E7E5DD; position:relative; flex-shrink:0; transition:border-color .2s; }
.ob .ck.on { border-color:#064E3B; }
.ob .ck i { position:absolute; inset:0; border-radius:50%; background:#064E3B; transform:scale(.2); opacity:0; transition:transform .35s cubic-bezier(.3,1.6,.4,1), opacity .2s; }
.ob .ck.on i { transform:scale(1); opacity:1; }

// iOS style page motion. push: the new page slides over while the old one drifts back.
// zoom: the page opens out of the card she tapped. pop: the reverse. tab: a soft dissolve.
function navMotion(scr, oldView, oldTop, nv, dir){
  const ghost=document.createElement('div'); ghost.className='navghost'; oldView.classList.remove('navin'); ghost.appendChild(oldView);
  const shade=document.createElement('div'); shade.className='navshade';
  scr.insertBefore(ghost, scr.firstChild); scr.insertBefore(shade, ghost.nextSibling); oldView.scrollTop=oldTop;
  const ease='cubic-bezier(.2,.9,.25,1)', dur = dir==='tab' ? 260 : (dir==='zoom' ? 520 : 440);
  const done=()=>{ ghost.remove(); shade.remove(); nv.classList.remove('navin'); nv.style.cssText=''; };
  if (dir==='tab') {
    ghost.animate([{opacity:1},{opacity:0}], {duration:dur, easing:'ease-out', fill:'forwards'});
    nv.animate([{opacity:0, filter:'blur(6px)', transform:'scale(.985)'},{opacity:1, filter:'none', transform:'none'}], {duration:dur+80, easing:ease}).onfinish=done;
    return;
  }

    shade.animate([{opacity:0},{opacity:.18}], {duration:dur, easing:ease, fill:'forwards'});
    S.navFrom=null; return;
  }
  if (dir==='push') {
    nv.animate([{transform:'translateX(100%)'},{transform:'none'}], {duration:dur, easing:ease}).onfinish=done;
    oldView.animate([{transform:'none'},{transform:'translateX(-30%)'}], {duration:dur, easing:ease, fill:'forwards'});
    shade.animate([{opacity:0},{opacity:.12}], {duration:dur, easing:ease, fill:'forwards'});

    scr.appendChild(ghost); ghost.style.zIndex=8; ghost.style.background='transparent'; oldView.style.background='var(--bg)'; oldView.style.boxShadow='-12px 0 30px rgba(0,0,0,.12)';

function quranList(){

      + `<div class="gtitle" style="margin-top:24px">114 Surahs</div><div class="list" style="border-radius:16px">${Q.surahs.map((su,i)=>{ const h=surahRow(su, f&&i<12?.4+Math.min(i,8)*.05:null); return f&&i<12?h.replace('<div class="li" ',`<div class="li deal" style="${AD(.2+Math.min(i,8)*.05)}" `):h; }).join('')}</div>`;

}

function readerMotion(){

    const f=$('rfill'); if (f) f.style.width = Math.max(6, ((firstVisible||1)-1)/Math.max(1,total-1)*nv.clientWidth)+'px';
    const em=$('endmark'); if (em && em.getBoundingClientRect().top < vb.bottom - 60 && !em.classList.contains('done')) { em.classList.add('done'); const cur=S.stacks[S.tab].slice(-1)[0]; if (cur && cur.r==='reader') { S.completed=[...new Set([...(S.completed||[]), cur.s])]; } if (navigator.vibrate) try{navigator.vibrate(15)}catch(e){} }

function makeQuiz(){

    else if (i%5===1){ const su=pick(Q.surahs.filter(x=>x.ayahs.length>=5)), n=su.ayahs.length; const counts=[...new Set(Q.surahs.map(x=>x.ayahs.length))].filter(x=>x!==n).sort((x,y)=>Math.abs(x-n)-Math.abs(y-n)).slice(0,6); q={p:`How many verses are in ${su.name}?`, c:String(n), w:shuf(counts).slice(0,3).map(String), e:`${su.name} has ${n} verses.`}; }

    else if (i%5===3){ const su=pick(Q.surahs); q={p:`What does the name ${su.name} mean?`, c:su.meaning, w:shuf(Q.surahs.filter(x=>x.meaning!==su.meaning)).slice(0,3).map(x=>x.meaning), e:`${su.name} means ${su.meaning}.`}; }

/* ---------- Audio ---------- */
function play(s,a,through){
  S.playing={s,a,through}; S.isPlaying=true; S.audioFail=false; S.repeatLeft = S.repeat||S.repeatMode||1; S.repeat=null;
  audio.src = `https://cdn.islamic.network/quran/audio/128/${S.reciter||'ar.alafasy'}/${globalNum(s,a)}.mp3`;
  audio.play().catch(()=>{}); render(true);
  setTimeout(()=>{ const el=$('v'+a); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}
function globalNum(s,a){ let n=0; for (let i=0;i<s-1;i++) n+=Q.surahs[i].ayahs.length; return n+a; }
function toggle(){ if (!S.playing) return; S.isPlaying ? audio.pause() : audio.play(); S.isPlaying=!S.isPlaying; render(true); }
function stopAudio(){ audio.pause(); S.playing=null; S.isPlaying=false; S.fullPlayer=false; S.fpLast=null; render(true); }
audio.addEventListener('error', ()=>{ if (S.playing && audio.src) { S.audioFail=true; render(true); } });
audio.onended = () => {
  const p=S.playing; if(!p) return;
  if (S.repeatLeft>1) { S.repeatLeft--; audio.currentTime=0; audio.play(); return; }
  const last = p.through || Q.surahs[p.s-1].ayahs.length;
  if (p.a < last) play(p.s, p.a+1, p.through); else stopAudio();
};
function mini(noTab){
  const p=S.playing;
  return `<div class="mini ${noTab?'notab':''}"><div role="button" aria-label="Now playing ${Q.surahs[p.s-1].name}, verse ${p.a}" style="flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0" onclick="S.fullPlayer=true;S.fpLast=null;render(true)"><div class="circle" style="width:36px;height:36px;flex-shrink:0">${S.isPlaying?'<span class="waves"><i></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i></span>':IC.phones}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:600; font-size:15px">${Q.surahs[p.s-1].name}</div><div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${S.audioFail?'color:var(--blushStrong)':''}">${S.audioFail?'Could not load audio':`Verse ${p.a} · ${reciterName()}`}</div></div></div>
    <button class="playbtn" onclick="toggle()">${S.isPlaying?IC.pause:IC.play}</button>
    <button class="circle" style="width:36px;height:36px;background:none;color:var(--text2)" onclick="stopAudio()" aria-label="Stop">${IC.x}</button></div>`;
}

/* ---------- Dhikr ---------- */
function dhikr(){
  const p=C.dhikr.find(x=>x.id===S.dhikrSel); const n=S.dhikr[p.id]||0; const done=n>=p.target;
  const beads=Math.min(p.target,33), filled=n===0?0:((n-1)%beads)+1;
  const ring=Array.from({length:beads},(_,i)=>{const a=i/beads*2*Math.PI-Math.PI/2; return `<div class="bead ${i<filled?(done?'on gold':'on'):''} ${i===filled-1?'now':''}" style="left:${132+Math.cos(a)*122}px;top:${132+Math.sin(a)*122}px;animation-delay:${.1+i*.016}s"></div>`;}).join('');
  const dir=S.dhikrDir||'r'; S.dhikrDir=null;
  return nav('Dhikr', `<button class="navbtn" aria-label="Reset" onclick="if(confirm('Reset the count to zero?')){resetDhikr()}">${IC.reset}</button>`)
   + `<div style="display:flex; flex-direction:column; align-items:center; text-align:center; min-height:780px">
      <select class="focusin" onchange="pickDhikr(this.value)" style="margin-top:12px; font:inherit; font-weight:600; color:var(--accent); background:var(--wash); border:none; border-radius:999px; padding:8px 16px; appearance:none; text-align:center; animation-delay:.05s">${C.dhikr.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.transliteration} ⌄</option>`).join('')}</select>
      <div id="phr" class="${dir==='l'?'slide-l':'slide-r'}" style="width:100%; touch-action:pan-y; cursor:grab">
        <div class="ar center ink" style="font-size:38px; margin-top:14px; width:100%; animation-delay:.15s; animation-duration:.9s">${p.arabic}</div>
        <div class="serif muted focusin" style="font-size:17px; animation-delay:.45s">${p.translation}</div>
        <div class="muted focusin" style="font-size:12px; margin-top:6px; opacity:.8; animation-delay:.55s">${p.source}</div>
        
      </div>
      <div style="flex:1; min-height:20px"></div>
      <div class="beads" id="beads"><div class="dglow" id="dglow"></div>${ring}<div id="orbit" style="transform:rotate(${n?(n-1)/beads*360:0}deg)"><i style="opacity:${n?1:0};${done?'background:rgba(201,162,74,.3)':''}"></i></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="count" id="cnt" style="font-size:76px">${n}</div><div id="cntsub" style="font-size:15px; font-weight:500; color:${done?'var(--accent)':'var(--text2)'}">${done?'<span class="dchk">✓</span> Complete':'of '+p.target}</div></div></div>
      <div style="flex:1; min-height:20px"></div>
      <div class="tap deal" id="tapzone" style="position:relative; overflow:hidden; height:190px; animation-delay:.35s" onclick="tapDhikr(event)"><span id="tapic" class="${n?'':'tpulse'}" style="display:inline-flex">${IC.tap}</span></div>
    </div>`;
}
function pickDhikr(id){
  const i=C.dhikr.findIndex(x=>x.id===S.dhikrSel), j=C.dhikr.findIndex(x=>x.id===id);
  S.dhikrDir = j>i ? 'r' : 'l'; S.dhikrSel=id; render(true); if (navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
}
function stepDhikr(off){
  const i=C.dhikr.findIndex(x=>x.id===S.dhikrSel), L=C.dhikr.length;
  S.dhikrDir = off>0 ? 'r' : 'l'; S.dhikrSel=C.dhikr[(i+off+L)%L].id; render(true); if (navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
}
function resetDhikr(){
  S.dhikr[S.dhikrSel]=0;
  const bs=[...document.querySelectorAll('.bead')], L=bs.length;
  bs.forEach((b,i)=>{ b.style.transitionDelay=((L-i)*12)+'ms'; b.classList.remove('on','gold','now'); });
  const o=$('orbit'); if (o) o.firstElementChild.style.opacity=0;
  const c=$('cnt'); if (c) c.textContent='0';
  const p=C.dhikr.find(x=>x.id===S.dhikrSel); const sub=$('cntsub'); if (sub) { sub.textContent='of '+p.target; sub.style.color='var(--text2)'; }
  const ic=$('tapic'); if (ic) ic.classList.add('tpulse');
}
function bindDhikrSwipe(){
  const el=$('phr'); if (!el || el.dataset.bound) return; el.dataset.bound=1; let x0=null, y0=null;
  el.addEventListener('pointerdown', e=>{ x0=e.clientX; y0=e.clientY; });
  el.addEventListener('pointerup', e=>{ if (x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null; if (Math.abs(dx)>24 && Math.abs(dx)>Math.abs(dy)) stepDhikr(dx<0?1:-1); });
}

function tapDhikr(ev){
  const id=S.dhikrSel, p=C.dhikr.find(x=>x.id===id); const prev=S.dhikr[id]||0; S.dhikr[id]=prev+1;
  const n=S.dhikr[id], beads=Math.min(p.target,33), filled=((n-1)%beads)+1, prevFilled=prev===0?0:((prev-1)%beads)+1;
  const done=n>=p.target, justDone=n===p.target, roundEnd=!justDone && n%beads===0;
  if (navigator.vibrate) try{ navigator.vibrate(justDone?[20,40,30]:(roundEnd?24:8)) }catch(e){}
  const z=$('tapzone'); if (z&&ev) { const r=z.getBoundingClientRect(), zoom=parseFloat(document.querySelector('.phone').style.zoom||1); const rp=document.createElement('span'); rp.className='ripple'; rp.style.left=((ev.clientX/zoom)-r.left/zoom)+'px'; rp.style.top=((ev.clientY/zoom)-r.top/zoom)+'px'; z.appendChild(rp); setTimeout(()=>rp.remove(),700); }
  const bs=[...document.querySelectorAll('.bead')], L=bs.length, releasing=filled<prevFilled;
  bs.forEach((b,i)=>{ b.style.animation='none'; b.style.transitionDelay = releasing ? ((L-i)*12)+'ms' : '0ms'; b.classList.toggle('on', i<filled); b.classList.toggle('gold', done && i<filled); b.classList.toggle('now', i===filled-1); if (justDone) b.style.transitionDelay=(i*15)+'ms'; });
  if (roundEnd || justDone) bs.forEach((b,i)=>{ void b.offsetWidth; b.style.animation=`bwave .47s ${i*12}ms backwards`; });
  const o=$('orbit'); if (o) { o.style.transform=`rotate(${(n-1)/beads*360}deg)`; o.firstElementChild.style.opacity=1; o.firstElementChild.style.background = done ? 'rgba(201,162,74,.3)' : ''; }
  const c=$('cnt'); if (c) { c.textContent=n; c.classList.remove('cpop','big'); void c.offsetWidth; c.classList.add('cpop'); if (justDone) c.classList.add('big'); }
  const ic=$('tapic'); if (ic) { ic.classList.remove('tpulse','bounce'); void ic.offsetWidth; ic.classList.add('bounce'); }
  const sub=$('cntsub'); if (sub && done && !sub.dataset.done) { sub.dataset.done=1; sub.innerHTML='<span class="dchk">✓</span> Complete'; sub.style.color='var(--accent)'; }
  if (justDone) {
    const g=$('dglow'); if (g) { g.classList.remove('bloom'); void g.offsetWidth; g.classList.add('bloom'); }
    const host=$('beads'); for (let i=0;i<14;i++){ const sp=document.createElement('span'); sp.className='spark2'; sp.style.setProperty('--r',(i*360/14)+'deg'); sp.style.background= i%2 ? 'var(--accentFill)' : '#D3A94A'; host.appendChild(sp); setTimeout(()=>sp.remove(),800); }
  }
}

/* ---------- The Mushaf ---------- */
// The Quran as a book: a tooled cover that swings open on the right, 604 Madani pages that turn
// right to left, a silk ribbon, and a gilt edge to riffle through. Mirrors MushafView.swift.
let MF = null;
const MF_SIZES = [25, 23, 21, 19.5, 18, 16.5, 15, 13.5, 12];
const mfStill = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function mfData(){
  if (MF) return MF;
  const pages = [];
  Q.surahs.forEach(su => su.pages.forEach((p, i) => { (pages[p-1] = pages[p-1] || []).push([su.id, i+1]); }));
  MF = { pages, fit:{}, lhr:null, anim:false, scrub:null };
  return MF;
}
function mfStar(cx, cy, d){
  const o = d/2, n = o*.48; let p = '';
  for (let i = 0; i < 16; i++) { const a = i*Math.PI/8 - Math.PI/2, r = i%2 ? n : o; p += (i?'L':'M') + (cx+Math.cos(a)*r).toFixed(2) + ' ' + (cy+Math.sin(a)*r).toFixed(2); }
  return p + 'Z';
}
function mfArch(x0, y0, x1, y1){
  const w = x1-x0, h = y1-y0, sh = h*.16, mx = (x0+x1)/2;
  return `M${x0} ${y0+sh}Q${x0+w*.28} ${y0+sh*.15} ${mx} ${y0}Q${x1-w*.28} ${y0+sh*.15} ${x1} ${y0+sh}L${x1} ${y1-sh}Q${x1-w*.28} ${y1-sh*.15} ${mx} ${y1}Q${x0+w*.28} ${y1-sh*.15} ${x0} ${y1-sh}Z`;
}
// The closed mushaf: a deep green board with tooled gold. Every gold line is drawn three times,
// a dark groove below, the metal, and a faint highlight above, so it reads as pressed in.
function mfCoverSVG(id, ratio, shine){
  const W = 660, H = Math.round(W / (ratio || .66)), c = 49.5, gold = '<stop offset="0" stop-color="#F3E5AB"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#7A5A15"/>';
  let emb = `<rect x="29.7" y="29.7" width="${W-59.4}" height="${H-59.4}" fill="none" stroke-width="3.3"/><rect x="69.3" y="69.3" width="${W-138.6}" height="${H-138.6}" fill="none" stroke-width="1.65"/>`;
  [[c,c],[W-c,c],[c,H-c],[W-c,H-c]].forEach(([x,y]) => emb += `<path d="${mfStar(x,y,79.2)}" stroke="none"/>`);
  emb += `<path d="${mfArch(112.2,112.2,W-112.2,H-112.2)}" fill="none" stroke-width="2.64"/><path d="${mfArch(132,132,W-132,H-132)}" fill="none" stroke-width="1.32"/>`;
  emb += `<path d="${mfStar(W/2,H*.27,59.4)}" stroke="none"/><path d="${mfStar(W/2,H*.8,59.4)}" stroke="none"/>`;
  let run = ''; const s = c*.32;
  for (let x = c+c; x < W-c-c/2; x += c) run += mfStar(x,c,s) + mfStar(x,H-c,s);
  for (let y = c+c; y < H-c-c/2; y += c) run += mfStar(c,y,s) + mfStar(W-c,y,s);
  const title = (dy, fill, op) => `<text x="${W/2}" y="${512+dy}" font-family="Amiri Quran, serif" font-size="85.8" direction="rtl" fill="${fill}" opacity="${op}">القرآن الكريم</text><text x="${W/2}" y="${600+dy}" font-family="Georgia, 'Times New Roman', serif" font-size="46.2" font-weight="500" fill="${fill}" opacity="${op}">The Holy Quran</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" aria-hidden="true"><defs>
    <radialGradient id="${id}b" gradientUnits="userSpaceOnUse" cx="${W/2}" cy="${H/2}" r="750"><stop offset="0" stop-color="#87382A"/><stop offset=".5" stop-color="#5A1E18"/><stop offset="1" stop-color="#1B0807"/></radialGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1">${gold}</linearGradient>
    <linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1">${gold}</linearGradient>
    <g id="${id}e">${emb}</g></defs>
    <rect width="${W}" height="${H}" rx="16.5" fill="url(#${id}b)"/>
    <use href="#${id}e" fill="#000" stroke="#000" opacity=".55" transform="translate(0 2)"/>
    <use href="#${id}e" fill="url(#${id}g)" stroke="url(#${id}g)"/>
    <use href="#${id}e" fill="#fff" stroke="#fff" opacity=".25" transform="translate(0 -1)" style="mix-blend-mode:plus-lighter"/>
    <path d="${run}" fill="#C9A26D"/>
    <g text-anchor="middle">${title(2.5,'#000','.6')}${title(0,`url(#${id}t)`,'1')}</g>${shine ? mfShineSVG(id, W, H) : ''}</svg>`;
}
// CoverShine: a soft band of gold light that passes across the closed cover every few seconds.
function mfShineSVG(id, W, H){
  const bw = W*.45;
  return `<defs><clipPath id="${id}k"><rect width="${W}" height="${H}" rx="16.5"/></clipPath>
    <linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#F3E5AB" stop-opacity="0"/><stop offset=".5" stop-color="#F3E5AB" stop-opacity=".28"/><stop offset="1" stop-color="#F3E5AB" stop-opacity="0"/></linearGradient></defs>
    <g class="mf-shinewrap" clip-path="url(#${id}k)" style="mix-blend-mode:plus-lighter"><g class="mf-shine"><rect x="0" y="${-H*.25}" width="${bw}" height="${H*1.5}" fill="url(#${id}s)" transform="rotate(18 ${bw/2} ${H/2})"/></g></g>`;
}
const mfStarSVG = () => `<svg viewBox="0 0 12 12"><path d="${mfStar(6,6,12)}"/></svg>`;
const mfRibbonHTML = cls => `<svg class="mf-rib ${cls}" viewBox="0 0 18 90"><defs><linearGradient id="mfrg" x1="0" x2="1"><stop offset="0" stop-color="#9A1B2B"/><stop offset="1" stop-color="#8E3651"/></linearGradient></defs><path d="M0 0H18V90L9 80L0 90Z" fill="url(#mfrg)"/></svg>`;
function mfFirst(n){ const v = mfData().pages[n-1]; return v && v[0] ? v[0] : [1,1]; }
function mfPageHTML(n){
  const M = mfData(), vs = M.pages[n-1] || [], [fs, fa] = mfFirst(n), star = mfStarSVG();
  // A page that is newly appearing drops its ribbon and lights its surah band, once.
  const fresh = !mfStill() && !(M.vis || []).includes(n);
  const blocks = []; let run = '';
  for (const [s, a] of vs) {
    if (a === 1) {
      if (run) { blocks.push(`<div class="mf-t">${run}</div>`); run = ''; }
      blocks.push(`<div class="mf-band${fresh ? ' lit' : ''}">${star}<span>سورة ${Q.surahs[s-1].arabicName}</span>${star}</div>`);
      if (s !== 1 && s !== 9) blocks.push(`<div class="mf-bas">${Q.basmala}</div>`);
    }
    run += esc(verse(s, a)) + ' ﴿' + ai(a) + '﴾ ';
  }
  if (run) blocks.push(`<div class="mf-t">${run}</div>`);
  const cs = [['top','left'],['top','right'],['bottom','left'],['bottom','right']].map(([v,h]) => `<svg class="mf-cs" style="${v}:-4px;${h}:-4px" viewBox="0 0 12 12"><path d="${mfStar(6,6,12)}"/></svg>`).join('');
  return `<div class="mf-paper" data-p="${n}"><div class="mf-hd"><span>الجزء ${ai(juzOf(fs, fa))}</span><span>${Q.surahs[fs-1].arabicName}</span></div>
    <div class="mf-frame">${cs}<div class="mf-body"><div class="mf-txt" style="--fs:${M.fit[n] || 25}px">${blocks.join('')}</div></div></div>
    <div class="mf-no">${ai(n)}</div>${S.mfRibbon === n ? mfRibbonHTML(fresh ? 'in' : '') : ''}</div>`;
}
// The largest size whose text fits the frame, stepping down the way ViewThatFits does.
function mfFit(paper){
  const M = mfData(), n = +paper.dataset.p, body = paper.querySelector('.mf-body'), txt = body && body.firstElementChild;
  if (!txt) return;
  if (M.fit[n]) { txt.style.setProperty('--fs', M.fit[n] + 'px'); return; }
  if (!M.lhr) return;
  let pick = MF_SIZES[MF_SIZES.length-1];
  for (const s of MF_SIZES) { txt.style.setProperty('--fs', s + 'px'); if (txt.offsetHeight <= body.clientHeight + .5) { pick = s; break; } }
  txt.style.setProperty('--fs', pick + 'px'); M.fit[n] = pick;
}
function mfCard(f){
  const p = S.mfPage || 1, roll = S.mfCardShown != null && S.mfCardShown !== p; S.mfCardShown = p;
  return `<div class="card press mf-card ${K(f,'focusin')}" style="margin-top:8px" role="button" aria-label="The Mushaf, page ${p}" onclick="mfOpen(this)">
    <div class="mf-mini ${f && !mfStill() ? 'lift' : ''}">${mfCoverSVG('mfc')}</div>
    <div style="flex:1"><div class="serif" style="font-size:20px;font-weight:600">The Mushaf</div><div class="muted" style="font-size:15px;font-variant-numeric:tabular-nums">Page <span class="${roll ? 'mf-roll' : ''}">${p}</span></div></div>
    <div style="color:var(--accent);display:flex">${IC.book}</div></div>`;
}
function mushafOverlay(){
  const n = S.mfPage || 1, rib = S.mfRibbon === n, page = mfPageHTML(n);
  MF.vis = [n];
  return `<div class="mf dark ${S.mfOpened ? 'opened' : ''} ${S.mfChrome !== false ? 'chrome' : ''}" id="mushaf">
    <div class="mf-stage" id="mfstage"><div class="mf-pg">${page}</div></div>
    ${S.mfOpened ? '' : `<div class="mf-cw" id="mfcw"><div class="mf-cover" id="mfcover" role="button" aria-label="The Holy Quran">${mfCoverSVG('mfb', 400/748, !mfStill())}</div></div>`}

      <div class="mf-top">
        <button class="mf-gl" aria-label="Close" onclick="mfClose()"><svg width="15" height="15" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
        <div class="mf-ttl"><b id="mfname"></b><small id="mfsub"></small></div>
        <button class="mf-gl" id="mfribbtn" data-mfrib aria-label="Ribbon" onclick="mfMenu()">${rib ? IC.bmf : IC.bm}</button>
      </div>
      <div class="mf-gilt" id="mfgilt" role="slider" aria-label="Page" aria-valuemin="1" aria-valuemax="604" aria-valuenow="${n}"><div class="mf-track"></div><div class="mf-knob" id="mfknob"></div><div class="mf-bub" id="mfbub"><b></b><small></small></div></div>
    </div></div>`;
}
function mfOpen(el){

  mfData(); S.mfPage = S.mfPage || 1; S.mfRibbon = S.mfRibbon || 0;
  S.mushaf = true; S.mfOpened = false; S.mfChrome = true; S.mfMenu = false; MF.anim = false; MF.scrub = null; MF.vis = [];

}
function mfClose(){

  const lt = root.querySelector('.mf-light'); if (lt) lt.remove();

}
function mfCloseNow(){

}
function mfMount(){

    r.querySelectorAll('.mf-paper').forEach(mfFit);
  };
  root.style.setProperty('--lhr', M.lhr || 2);
  if (M.lhr) ready(); else document.fonts.load('25px "Amiri Quran"').then(ready, ready);

  root.addEventListener('pointerdown', e => { if (S.mfMenu && !e.target.closest('.pmenu,[data-mfrib]')) { mfMenu(false); e.stopPropagation(); } }, true);

    const sr = scr.getBoundingClientRect(), z = sr.width/scr.offsetWidth, r = S.mfFrom; S.mfFrom = null;

    const t = (r.top-sr.top)/z, l = (r.left-sr.left)/z, b = (sr.bottom-r.bottom)/z, rt = (sr.right-r.right)/z;
    root.animate([{clipPath:`inset(${t}px ${rt}px ${b}px ${l}px round 22px)`, opacity:.4}, {clipPath:'inset(0px 0px 0px 0px round 56px)', opacity:1}], {duration:520, easing:'cubic-bezier(.2,.9,.25,1)'});

}
function mfBindCover(){
  const cover = $('mfcover'); if (!cover) return; let x0 = null;
  cover.onpointerdown = e => { x0 = e.clientX; try { cover.setPointerCapture(e.pointerId); } catch(_){} };

  cover.onpointercancel = () => { x0 = null; };
}
function mfOpenBook(){
  if (S.mfOpened) return; S.mfOpened = true; vib(8);
  const root = $('mushaf'), wrap = $('mfcw'), cover = $('mfcover'); if (!root) return;
  root.classList.add('opened'); mfSync();
  if (!wrap) return;
  if (mfStill()) { wrap.animate([{opacity:1},{opacity:0}], {duration:300, easing:'ease-in-out', fill:'forwards'}).onfinish = () => wrap.remove(); return; }
  const sh = cover.querySelector('.mf-shinewrap'); if (sh) sh.remove();
  // Hinged on the right, like a mushaf, so the cover swings open to the right.
  cover.animate([{transform:'rotateY(0deg)'}, {transform:'rotateY(100deg)'}], {duration:900, easing:'cubic-bezier(.32,.72,.28,1)', fill:'forwards'});
  setTimeout(() => wrap.remove(), 700);
  mfLight(root);
}
// OpeningLight: a warm light rises from the page as the cover swings open, with a few gold specks.
// It blooms over 0.6s from 0.15s, then fades over 0.9s from 0.9s.
function mfLight(root){
  let sp = '';
  for (let i = 0; i < 10; i++) { const d = 2 + i%3; sp += `<i class="mf-speck" data-y="${-140 - (i%4)*30}" style="width:${d}px;height:${d}px;margin:${-d/2}px 0 0 ${-d/2}px;left:calc(50% + ${(((i*37)%100)/100 - .5)*260}px);top:50%;transform:translateY(60px)"></i>`; }
  root.insertAdjacentHTML('beforeend', `<div class="mf-light"><div class="mf-glow"></div>${sp}</div>`);
  const el = root.lastElementChild, T = 1800, o = [0, 150/T, 750/T, 900/T, 1], ez = ['linear', 'ease-out', 'linear', 'ease-in'];

  el.firstElementChild.animate(kf({transform:'scale(.6)'}, {transform:'scale(1.15)'}), {duration:T, fill:'forwards'});
  el.querySelectorAll('.mf-speck').forEach(s => s.animate(kf({transform:'translateY(60px)'}, {transform:`translateY(${s.dataset.y}px)`}), {duration:T, fill:'forwards'}));
}
function mfSync(){
  const n = S.mfPage, [s, a] = mfFirst(n), su = Q.surahs[s-1];
  const name = $('mfname'), sub = $('mfsub'), btn = $('mfribbtn'), gilt = $('mfgilt');
  if (name) name.textContent = su.name;
  if (sub) { const prev = +sub.dataset.p || 0; sub.dataset.p = n; sub.innerHTML = `Juz ${juzOf(s, a)} · Page <span class="${prev && prev !== n ? 'mf-roll' : ''}">${n}</span>`; }
  if (btn) btn.innerHTML = S.mfRibbon === n ? IC.bmf : IC.bm;
  if (gilt) gilt.setAttribute('aria-valuenow', n);
  mfSyncGilt();
}
function mfSyncGilt(){
  const gilt = $('mfgilt'), knob = $('mfknob'), bub = $('mfbub'); if (!gilt) return;
  const w = gilt.offsetWidth, i = MF.scrub != null ? MF.scrub : S.mfPage - 1, x = w * (1 - i/603);
  knob.style.left = x + 'px';
  if (MF.scrub != null) {
    const [s] = mfFirst(i+1), bw = bub.offsetWidth || 100;
    bub.firstElementChild.textContent = Q.surahs[s-1].name; bub.lastElementChild.textContent = 'Page ' + (i+1);
    bub.style.left = Math.min(Math.max(x - bw/2, 0), w - bw) + 'px';
  }
}
function mfBindGilt(){
  const gilt = $('mfgilt'); if (!gilt) return;
  const at = e => { const r = gilt.getBoundingClientRect(); return Math.round((1 - Math.min(Math.max((e.clientX - r.left)/r.width, 0), 1)) * 603); };
  // Riffling: the page under her finger is the page she sees, swapped without a turn.
  const riffle = () => { if (MF.scrub + 1 !== S.mfPage) { S.mfPage = MF.scrub + 1; mfShow(S.mfPage); } else mfSyncGilt(); };
  gilt.onpointerdown = e => { if (MF.anim || MF.closing) return; try { gilt.setPointerCapture(e.pointerId); } catch(_){} MF.scrub = at(e); gilt.classList.add('on'); riffle(); };
  gilt.onpointermove = e => { if (MF.scrub == null) return; const v = at(e); if (v !== MF.scrub) { MF.scrub = v; vib(6); riffle(); } };
  const end = () => { if (MF.scrub == null) return; const v = MF.scrub; MF.scrub = null; gilt.classList.remove('on'); mfGoTo(v + 1); mfSyncGilt(); };

}
function mfBindStage(){
  const stage = $('mfstage'); if (!stage) return; let g = null;
  stage.onpointerdown = e => { if (MF.anim || !S.mfOpened || MF.closing) return; g = {x:e.clientX, y:e.clientY, t:performance.now(), r:stage.getBoundingClientRect(), turn:null, p:0}; try { stage.setPointerCapture(e.pointerId); } catch(_){} };

}
function mfChromeToggle(){
  S.mfChrome = S.mfChrome === false; const root = $('mushaf'); if (root) root.classList.toggle('chrome', S.mfChrome);
  const st = document.querySelector('#screen .status'); if (st) st.style.opacity = S.mfChrome ? '' : 0;
  if (!S.mfChrome && S.mfMenu) mfMenu(false);
}
const mfCan = dir => S.mfPage + dir >= 1 && S.mfPage + dir <= 604;
function mfShow(n){

  const bandT = old ? [...old.querySelectorAll('.mf-band')].map(live) : [], ribT = old ? live(old.querySelector('.mf-rib.in')) : null;
  stage.innerHTML = `<div class="mf-pg">${mfPageHTML(n)}</div>`; MF.vis = [n];

}
// A leaf turns over the spine on the right. Forward: the page she is on lifts from its left edge
// and swings over to the right. Back: the previous leaf swings back over from the right.
function mfBegin(dir){
  const stage = $('mfstage'), cur = stage.querySelector('.mf-pg'), m = S.mfPage + dir;
  const page = n => { const d = document.createElement('div'); d.className = 'mf-pg'; d.innerHTML = mfPageHTML(n); MF.vis = [S.mfPage, n]; return d; };
  const leaf = document.createElement('div'); leaf.className = 'mf-leaf'; leaf.innerHTML = '<div class="mf-face"></div><div class="mf-back"></div>';

function mfSetP(t, p){

function mfFinish(t, target){

}
function mfStep(dir){
  if (MF.anim || !mfCan(dir)) return;
  if (mfStill()) { S.mfPage += dir; vib(6); mfShow(S.mfPage); return; }
  mfFinish(mfBegin(dir), 1);
}
function mfGoTo(n){
  n = Math.min(604, Math.max(1, n)); if (n === S.mfPage || MF.anim) return;
  if (Math.abs(n - S.mfPage) === 1) { mfStep(n - S.mfPage); return; }
  S.mfPage = n; mfShow(n);
}
function mfMenu(open){
  const root = $('mushaf'); if (!root) return;
  S.mfMenu = open === undefined ? !S.mfMenu : open;
  const old = root.querySelector('.pmenu'); if (old) old.remove();
  if (!S.mfMenu) return;
  const n = S.mfPage, r = S.mfRibbon, items = [];
  items.push(r === n ? `<div class="mi" onclick="mfRibbon(0)">${IC.bm}Remove Ribbon</div>` : `<div class="mi" onclick="mfRibbon(${n})">${IC.bm}Place Ribbon Here</div>`);

function mfRibbon(v){
  mfMenu(false); S.mfRibbon = v; vib(6);

function fit(){ const ph=document.querySelector('.phone'); const z=Math.min(1,(innerHeight-24)/980,(innerWidth-(innerWidth>700?240:0))/464); ph.style.zoom=z; }
addEventListener('resize', fit); fit();
load();
