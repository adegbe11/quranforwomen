org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Play requires new uploads to target API 36 from 31 Aug 2026. AGP 8.7 warns on it, the build works.
android.suppressUnsupportedCompileSdk=36

# This connection drops DNS lookups and runs slowly on a cold cache, so give downloads room to finish.
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=2000
